<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Treino</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0e1014">
<script>
// aplica o tema antes de pintar a tela (evita "flash")
try{var t=localStorage.getItem('mt-theme');t=t&&JSON.parse(t);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f0f1f4;--line:#e3e5ea;--tx:#14161b;--mu:#636a79;
  --ac:#e8500f;--ac-soft:#fde9df;--ac-tx:#fff;--ok:#16a34a;--ok-soft:#dcf5e5;--warn:#b45309;--warn-soft:#fdf0d8;
  --bad:#dc2626;--bad-soft:#fde4e4;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --scrim:rgba(15,17,21,.45);--side-w:272px;--dock-h:0px;--r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014;--surface:#171a21;--surface2:#1f232c;--line:#2a2f3a;--tx:#eef0f4;--mu:#8d94a5;
    --ac:#ff6a2b;--ac-soft:#3a1f14;--ac-tx:#fff;--ok:#2fc57d;--ok-soft:#143524;--warn:#f5b041;--warn-soft:#3a2c12;
    --bad:#f26464;--bad-soft:#3b1a1a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014;--surface:#171a21;--surface2:#1f232c;--line:#2a2f3a;--tx:#eef0f4;--mu:#8d94a5;
  --ac:#ff6a2b;--ac-soft:#3a1f14;--ac-tx:#fff;--ok:#2fc57d;--ok-soft:#143524;--warn:#f5b041;--warn-soft:#3a2c12;
  --bad:#f26464;--bad-soft:#3b1a1a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;min-height:100dvh;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3{margin:0;line-height:1.2}
.mut{color:var(--mu)}
.ic{flex:none;display:block}
[hidden]{display:none!important}

/* ---------- Sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);max-width:86vw;background:var(--surface);border-right:1px solid var(--line);
  z-index:50;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.side.open{transform:none;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:800;font-size:19px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:12px;background:none;text-align:left;font-weight:600;color:var(--mu)}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--ac-soft);color:var(--ac)}
.nav .sub{padding:8px 12px 8px 44px;font-weight:500;font-size:15px}
.nav .sub.on{background:none;color:var(--tx)}
.side-sec{margin:14px 12px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.side-live{margin:12px 4px 0;padding:12px;border-radius:12px;background:var(--ac-soft);color:var(--ac);border:0;text-align:left;display:flex;align-items:center;gap:10px;font-weight:600}
.side-live b{font-variant-numeric:tabular-nums;margin-left:auto}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:8px}
.side-foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Top bar ---------- */
.wrap{min-height:100dvh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:none;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface2)}
.live{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:0;background:var(--ac);color:var(--ac-tx);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.sync{background:var(--warn)}.dot.err{background:var(--bad)}

main{max-width:780px;margin:0 auto;padding:14px 16px calc(32px + var(--dock-h) + env(safe-area-inset-bottom))}

/* ---------- Generic ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:var(--surface2);border-color:var(--surface2)}
.btn.big{width:100%;min-height:54px;font-size:17px;border-radius:14px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.grp{margin:18px 4px 8px;color:var(--ac);font-weight:800;font-size:12px;letter-spacing:.1em}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--ac-soft);margin-bottom:14px;font-size:14px}
.banner p{margin:0;flex:1}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.link-danger{display:block;margin:22px auto 4px;border:0;background:none;color:var(--bad);font-weight:600;font-size:14px;padding:10px}

/* ---------- Hero ---------- */
.hero{padding:4px 2px 12px}
.hero h2{font-size:24px;font-weight:800}
.hero p{margin:4px 0 0;font-size:14px}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.prog-l{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:6px}

/* ---------- Exercise card ---------- */
.ex{overflow:hidden}
.ex.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex-head{display:flex;gap:12px;padding:12px;align-items:center}
.thumbs{display:flex;flex:none;border-radius:12px;overflow:hidden;background:#fff;border:0;padding:0}
.thumbs img{width:52px;height:64px;object-fit:cover;display:block}
.ex-info{flex:1;min-width:0}
.ex-info h3{font-size:17px;font-weight:700}
.ex-info p{margin:3px 0 0;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{flex:none;font-size:13px;font-weight:700;color:var(--mu);background:var(--surface2);padding:5px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.complete .count{background:var(--ok-soft);color:var(--ok)}
.pg{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:9px 10px;border-radius:12px;font-size:13px;line-height:1.3}
.pg span{flex:1}
.pg.up{background:var(--ok-soft);color:var(--ok)}
.pg.keep{background:var(--surface2);color:var(--mu)}
.pg.down{background:var(--warn-soft);color:var(--warn)}
.pg button{border:0;border-radius:9px;padding:7px 11px;font-weight:700;font-size:13px;background:var(--ok);color:#fff}
.sets{padding:0 12px 4px}
.set,.set-h{display:grid;grid-template-columns:52px 1fr 1fr 48px;gap:8px;align-items:center}
.set-h{font-size:12px;color:var(--mu);font-weight:600;padding:0 0 4px}
.set-h span:nth-child(n+2){text-align:center}
.set{padding:4px 0}
.sn{font-size:14px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;line-height:1.15}
.sn small{font-size:11px;font-weight:500;display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;margin-top:2px}
.in{width:100%;min-width:0;height:46px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--tx);font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;appearance:none}
.in:focus{outline:2px solid var(--ac);outline-offset:-1px;background:var(--surface)}
.in:disabled{opacity:.7}
.in::placeholder{color:var(--mu);font-weight:500;opacity:.8}
.ck{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;justify-self:end}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .in{background:var(--ok-soft);border-color:transparent}
.set.resting .sn{color:var(--ac)}
.row-acts{display:flex;gap:8px;padding:6px 12px 12px}
.row-acts button{flex:1;min-height:38px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--mu);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}

/* ---------- Dock (bottom) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.dock-in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dock-row{display:flex;gap:8px;align-items:center}
.sess{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.sess small{font-size:12px;color:var(--mu)}
.sess b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rest{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--ac-soft);color:var(--ac);animation:up .2s ease}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.rest .lbl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.rest small{display:block;color:var(--mu);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest>div:first-child{flex:1;min-width:0}
.rest-t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx)}

/* ---------- Evolução / Histórico ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.stat b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.evo{padding:14px}
.evo h3{font-size:17px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.delta{font-size:13px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--mu);white-space:nowrap}
.delta.pos{background:var(--ok-soft);color:var(--ok)}
.delta.neg{background:var(--bad-soft);color:var(--bad)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmp>div{background:var(--surface2);border-radius:12px;padding:10px}
.cmp small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.cmp .d{font-size:12px;color:var(--mu)}
.cmp p{margin:6px 0 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp .start{border-left:3px solid var(--mu)}
.cmp .now{border-left:3px solid var(--ac)}
.spark{width:100%;height:auto;display:block;color:var(--ac)}
.spark text{fill:var(--mu);font-size:10px}
.spark-empty{font-size:13px;color:var(--mu);padding:8px 0}
details{border-top:1px solid var(--line);margin-top:10px}
details>summary{list-style:none;cursor:pointer;padding:10px 0 2px;font-size:14px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg)}
.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.hist td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.hist td:first-child{color:var(--mu);white-space:nowrap;width:72px}
.sess-card{padding:0 14px}
.sess-card>summary{padding:14px 0;color:var(--tx);border:0}
.sess-card[open]>summary{border-bottom:1px solid var(--line)}
.sess-card{margin-top:0}
.sess-sum{flex:1;min-width:0}
.sess-sum b{display:block;font-size:16px}
.sess-sum span{font-size:13px;color:var(--mu);font-weight:500}
.sess-ex{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess-ex:last-of-type{border-bottom:0}
.sess-ex b{display:block;margin-bottom:4px}
.sess-ex span{display:inline-block;margin:2px 10px 2px 0;font-variant-numeric:tabular-nums}
.sess-ex em{font-style:normal;color:var(--mu);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--mu);margin-left:6px;vertical-align:middle}
.tag.on{background:var(--ac-soft);color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:14px 14px 0}
.bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;opacity:.85}
.bars-l{display:flex;gap:6px;padding:6px 14px 12px;font-size:10px;color:var(--mu)}
.bars-l span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}

/* ---------- Config ---------- */
.cfg{padding:6px 14px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cfg-row:last-child{border-bottom:0}
.cfg-row label{flex:1}
.cfg-row small{display:block;color:var(--mu);font-size:13px}
.cfg-row .in{width:90px;height:42px;flex:none}
.cfg h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;padding:12px 0 4px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:var(--shadow)}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(20px)}

/* ---------- Auth ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.auth .card{width:100%;max-width:400px;padding:24px}
.auth .brand{padding:0 0 18px}
.auth h2{font-size:22px;margin-bottom:4px}
.auth form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.auth input{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--tx);font-size:16px}
.auth input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.auth .msg{font-size:14px;padding:10px 12px;border-radius:10px;margin:0}
.auth .msg.err{background:var(--bad-soft);color:var(--bad)}
.auth .msg.ok{background:var(--ok-soft);color:var(--ok)}
.auth .swap{border:0;background:none;color:var(--ac);font-weight:600;padding:10px;margin-top:4px}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal .card{width:100%;max-width:440px;padding:20px;margin:0;max-height:88dvh;overflow:auto;animation:up .2s ease}
.modal h2{font-size:20px;margin-bottom:8px}
.modal .body{font-size:15px;color:var(--mu)}
.modal .acts{display:flex;gap:8px;margin-top:18px}
.modal .acts .btn{flex:1}
.modal img{width:100%;border-radius:12px;display:block;background:#fff}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sum-grid div{background:var(--surface2);border-radius:12px;padding:12px;color:var(--tx)}
.sum-grid small{display:block;color:var(--mu);font-size:12px}
.sum-grid b{font-size:20px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:90;background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .25s;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.on{transform:translate(-50%,0)}

/* ---------- Modal "Meus pesos" (tela cheia no celular) ---------- */
.modal.full{padding:0;align-items:stretch}
.modal .sheet{max-width:none;max-height:none;height:100dvh;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden;border:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 8px 10px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;display:flex;align-items:center;gap:10px;font-size:19px}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;overscroll-behavior:contain}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f .btn{flex:1}
.sheet-f .btn.primary{flex:2}
.wdate{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;margin-bottom:14px;color:var(--tx)}
.wdate .in{width:auto;max-width:170px;height:42px;font-size:16px;padding:0 10px}
.wex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.wex-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wex-h h4{margin:0;font-size:16px;min-width:0}
.wex-h .btn{flex:none;font-size:12px;min-height:32px;padding:4px 10px}
.wgrid{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr));gap:6px;align-items:center}
.wgrid .in{height:42px;font-size:16px;padding:0 4px;border-radius:10px}
.wh{text-align:center;font-size:12px;font-weight:600;color:var(--mu)}
.wl{font-size:13px;font-weight:700;line-height:1.1;display:flex;flex-direction:column}
.wl small{font-size:11px;font-weight:500;color:var(--mu)}
.wl.b{color:var(--mu)}
.wl.c{color:var(--ac)}
@media (min-width:560px){
  .modal.full{padding:24px;align-items:center}
  .modal .sheet{max-width:640px;height:min(860px,92dvh);border-radius:var(--r);border:1px solid var(--line)}
  .sheet-h{padding-top:12px}
  .sheet-f{padding-bottom:12px}
}

/* ---------- Responsivo ---------- */
@media (min-width:560px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .thumbs img{width:64px;height:76px}
  .set,.set-h{grid-template-columns:64px 1fr 1fr 52px}
  .modal{align-items:center}
}
@media (min-width:960px){
  .side{transform:none;box-shadow:none;max-width:none}
  .scrim{display:none}
  .wrap{margin-left:var(--side-w)}
  .dock{left:var(--side-w)}
  .menu-btn{display:none!important}
  .top{padding-left:24px}
  main{padding-left:24px;padding-right:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" class="auth"><p class="mut">Carregando…</p></div>
<div id="auth" hidden></div>
<div id="app" hidden>
  <aside id="side" class="side" aria-label="Menu"></aside>
  <div id="scrim" class="scrim" data-a="closeMenu"></div>
  <div class="wrap">
    <header class="top">
      <button class="iconbtn menu-btn" data-a="menu" aria-label="Abrir menu" id="menuBtn"></button>
      <h1 id="title">Meu Treino</h1>
      <button class="live" id="liveChip" data-a="nav" data-v="treino" hidden><i></i><span id="chipT">00:00:00</span></button>
      <button class="iconbtn" data-a="themeToggle" aria-label="Alternar tema" id="themeBtn"></button>
    </header>
    <main id="main"></main>
  </div>
  <div id="dock" class="dock" hidden></div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/data.js"></script>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
